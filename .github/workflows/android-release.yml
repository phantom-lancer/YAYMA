name: Android-only Release

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write
  actions: read

jobs:
  generate-bridge:
    uses: ./.github/workflows/android-bridge.yml

  build-android:
    needs: generate-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Init
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config curl git unzip clang lld libclang-dev llvm-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: Cache Rust Target
        uses: actions/cache@v4
        with:
          path: |
            src/.dart_tool/hooks_runner/*/*/target
            ${{ runner.temp }}/frb_native_assets_*
          key: ${{ runner.os }}-android-target-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-target-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
          pub-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android Signing
        working-directory: ./src/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Persistent Android signing is not configured. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.keystore"
          } > key.properties

      - name: Restore Bridge
        uses: ./.github/actions/restore-bridge

      - name: Build Android ARM64 APK
        working-directory: ./src
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Collect APK
        run: |
          mkdir -p android_artifacts
          apk=src/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$apk"
          cp "$apk" "android_artifacts/yayama-android-arm64-v8a-2.7.0.apk"
          ls -lh android_artifacts

      - name: Publish Android-only GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "YAYAMA 2.7.0 - Android"
          body: |
            Android-only build of the YAYMA fork (upstream YAYMA 2.7.0).

            - Architecture: Android ARM64 (arm64-v8a), signed with the persistent fork keystore.
            - "Моя волна" rebuilt after the official composition: add/search top bar, oversized
              track title, centred artwork, pause / mode / like row and swipeable station cards.
            - Liquid Glass is now optical: backdrop sampling, a runtime refraction shader with
              caustics, a Fresnel rim and a specular lobe, preloaded and cached with a quiet
              translucent fallback. It can be switched off in Settings.
            - Audio quality is configured separately for Wi-Fi/Ethernet and mobile data, applied
              automatically on network changes while keeping the queue and playback position.
            - Whole-app appearance switch: YAYMA / Liquid Glass and Apple Music, persisted.
            - Fixes the navbar overflow that clipped the account avatar and the dead strip under
              the wave mini-player; icon-only phone navbar with equal slots and haptics.
            - Keeps the fork's wave renderer, sleep timer, play-next and existing settings.

            This release intentionally contains no desktop builds.
          files: android_artifacts/yayama-android-arm64-v8a-2.7.0.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
