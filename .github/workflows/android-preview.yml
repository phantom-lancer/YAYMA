name: Android APK Preview

on:
  push:
    branches:
      - feature/android-my-wave
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: generate-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Init
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config curl git unzip clang lld libclang-dev llvm-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: Cache Rust Target
        uses: actions/cache@v4
        with:
          path: |
            src/.dart_tool/hooks_runner/*/*/target
            ${{ runner.temp }}/frb_native_assets_*
          key: ${{ runner.os }}-android-target-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-target-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
          pub-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android Signing
        working-directory: ./src/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          missing=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!v}" ]; then present=$((present + 1)); else missing=$((missing + 1)); fi
          done
          if [ "$present" -eq 4 ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.keystore"
            } > key.properties
            echo "SIGN_SUFFIX=" >> "$GITHUB_ENV"
          elif [ "$missing" -eq 4 ]; then
            echo "No release signing secrets found; using debug signing for this preview."
            echo "SIGN_SUFFIX=-dsign" >> "$GITHUB_ENV"
          else
            echo "::error::Incomplete Android signing secrets. Configure all four signing secrets or none."
            exit 1
          fi

      - name: Restore Bridge
        uses: ./.github/actions/restore-bridge

      - name: Build APKs
        working-directory: ./src
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p android_artifacts
          for apk in src/build/app/outputs/flutter-apk/app-*-release.apk; do
            test -f "$apk"
            abi=$(basename "$apk" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$apk" "android_artifacts/yayma-android-${abi}-preview${SIGN_SUFFIX}.apk"
          done
          ls -lh android_artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yayma-android-preview
          path: android_artifacts/*.apk
          if-no-files-found: error
          compression-level: 0
