name: Android APK Preview
# ARM64-only personal build; persistent keystore signing is required for in-place updates. Triggered from feature branch.

on:
  push:
    branches:
      - feature/android-my-wave
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate-bridge:
    uses: ./.github/workflows/android-bridge.yml

  build-android:
    needs: generate-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Init
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config curl git unzip clang lld libclang-dev llvm-dev libgtk-3-dev libx11-dev libxi-dev libasound2-dev libdbus-1-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: Cache Rust Target
        uses: actions/cache@v4
        with:
          path: |
            src/.dart_tool/hooks_runner/*/*/target
            ${{ runner.temp }}/frb_native_assets_*
          key: ${{ runner.os }}-android-target-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-target-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
          pub-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android Signing
        working-directory: ./src/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          missing=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!v}" ]; then present=$((present + 1)); else missing=$((missing + 1)); fi
          done
          if [ "$present" -ne 4 ]; then
            echo "::error::Persistent Android signing is not configured. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.keystore"
          } > key.properties
          echo "SIGN_SUFFIX=" >> "$GITHUB_ENV"

      - name: Restore Bridge
        uses: ./.github/actions/restore-bridge

      - name: Dart tests
        working-directory: ./src
        # The suite builds native assets: cnativeapi needs the GTK/X11
        # headers and the Rust host build of the crate needs ALSA, all
        # installed above. Reported here, never blocking, because this
        # workflow's deliverable is the APK.
        continue-on-error: true
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter test --reporter expanded

      - name: Build APKs
        working-directory: ./src
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Collect ARM64 APK
        run: |
          mkdir -p android_artifacts
          apk=src/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$apk"
          cp "$apk" "android_artifacts/yayma-android-arm64-v8a-preview${SIGN_SUFFIX}.apk"
          ls -lh android_artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yayma-android-arm64-preview
          path: android_artifacts/*.apk
          if-no-files-found: error
          compression-level: 0
